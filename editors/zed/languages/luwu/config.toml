name = "Luwu"
grammar = "luau"
path_suffixes = ["luwu"]
line_comments = ["-- ", "--- "]
block_comment = ["--[[", "]]"]
autoclose_before = ";:.,=}])>"
first_line_pattern = "^#!.*\\b(luwu|seal)\\b"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "`", end = "`", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "<", end = ">", close = false, newline = false, not_in = ["comment", "string"] },
    { start = "then", end = "end", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "do", end = "end", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "function", end = "end", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "repeat", end = "until", close = false, newline = true, not_in = ["comment", "string"] },
]
tab_size = 4
# Where the parser can't see a block (class and trait bodies, `do` expressions), these line patterns indent
# instead, like the VS Code extension's indentationRules: a class or trait header, a line ending in `then`,
# `do`, `else`, `repeat`, an opening bracket or a function signature opens a block; `end`, `until`, `else`,
# `elseif` and a closing bracket close one.
increase_indent_pattern = "^\\s*(export\\s+)?(declare\\s+)?(class|trait)\\s+\\w+(\\s*\\(.*\\))?(\\s+(implements|needs)\\s+[\\w., ()\"']+)?\\s*$|^\\s*\\)\\s*(implements|needs)\\b.*$|\\b(then|do|else|repeat)\\s*$|\\bfunction\\b[^-]*\\)\\s*(:\\s*[^-]+)?$|[\\(\\{\\[]\\s*$"
decrease_indent_pattern = "^\\s*(end|until|else|elseif)\\b|^\\s*[\\)\\}\\]]"
